[package]
name = "charms-pqc-shield"
version = "0.1.0"
edition = "2021"
description = "Charms Protocol Post-Quantum App Contract (NIST FIPS 204 ML-DSA-65) for Bitcoin UTXO Programmability"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
sha2 = { version = "0.10", default-features = false }

[features]
default = ["std"]
std = ["serde/std", "sha2/std"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
