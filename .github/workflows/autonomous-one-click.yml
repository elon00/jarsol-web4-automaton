name: Autonomous One-Click Reality Check

on:
  workflow_dispatch:
  push:
    branches: ["main","master","gh-pages"]
  pull_request:

permissions:
  contents: read

jobs:
  autonomous-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run mandatory quality gates
        run: |
          npm test
          npm run test:quantum
          npm run build

      - name: Reality-first technology audit
        run: node scripts/autonomous-tech-audit.mjs

      - name: Upload technology report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: autonomous-tech-report
          path: AUTONOMOUS_TECH_REPORT.json
