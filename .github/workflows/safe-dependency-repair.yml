name: Dependency update candidate
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
        package-manager-cache: false
    - run: npm audit fix --package-lock-only --ignore-scripts --audit-level=high --fetch-timeout=30000
        --fetch-retries=1
    - run: npm ci --ignore-scripts
    - run: npm test
    - run: npm run test:quantum
    - run: npm run build
    - name: Create reviewable patch without writing repository branches
      run: 'mkdir -p reports

        git diff --binary -- package.json package-lock.json > reports/dependency-candidate.patch

        echo ''Candidate only: a pull request must pass every required gate before
        application.'''
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: dependency-candidate
        path: reports/dependency-candidate.patch
        if-no-files-found: error
