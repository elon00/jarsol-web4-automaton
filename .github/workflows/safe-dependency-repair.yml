name: Safe Dependency Auto-Repair

on:
  push:
    paths:
      - ".github/workflows/safe-dependency-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply non-breaking audit fixes
        run: npm audit fix || true

      - name: Validate repaired dependency graph
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); console.log(Object.keys(p.scripts||{}).join('\n'))" > /tmp/scripts.txt
          if grep -qx "lint" /tmp/scripts.txt; then npm run lint; fi
          if grep -qx "typecheck" /tmp/scripts.txt; then npm run typecheck; fi
          if grep -qx "test" /tmp/scripts.txt; then npm test; fi
          if grep -qx "test:nextgen" /tmp/scripts.txt; then npm run test:nextgen; fi
          if grep -qx "build" /tmp/scripts.txt; then npm run build; fi

      - name: Commit verified non-breaking dependency repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "No safe dependency changes were available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: apply verified non-breaking dependency repairs"
          git push
