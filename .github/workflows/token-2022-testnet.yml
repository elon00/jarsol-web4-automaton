name: Token-2022 Testnet Preflight (deployment blocked)
on:
  workflow_dispatch:
    inputs:
      decimals:
        description: Token decimals
        required: true
        default: '9'
        type: string
      initial_supply:
        description: Initial UI amount
        required: true
        default: '1000000'
        type: string
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Validate amount and Testnet identity; block deployment
        env:
          TOKEN_DECIMALS: ${{ inputs.decimals }}
          TOKEN_INITIAL_SUPPLY: ${{ inputs.initial_supply }}
          SOLANA_TESTNET_RPC: ${{ vars.SOLANA_TESTNET_RPC || 'https://api.testnet.solana.com' }}
        run: npx --no-install tsx -e "import { preflight } from './scripts/token2022-preflight.ts'; preflight().catch(() => { console.error('Preflight unavailable or invalid; no deployment performed.'); process.exitCode = 1; });"
