name: Deploy verified JarSol to GitHub Pages
'on':
  workflow_call: null
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: jarsol-pages
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      id: deployment
